:root {
  --chrome: #f3f4f6; --chrome2: #e5e7eb; --line: #d1d5db; --text: #1f2937; --muted: #6b7280;
  --accent: #2563eb; --accentSoft: #dbeafe; --danger: #dc2626; --panel: #ffffff; --canvas: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; color: var(--text);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--chrome); }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: grid; grid-template-rows: 38px 40px 1fr 30px; height: 100vh; }
.hidden { display: none !important; }

/* menubar */
#menubar { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); margin-right: 10px; }
.brand span { color: var(--text); }
#menus { display: flex; }
#menus > button { border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
#menus > button:hover, #menus > button.open { background: var(--chrome2); }
#docTitle { margin-left: auto; color: var(--muted); padding: 4px 8px; border-radius: 6px; cursor: text; max-width: 40%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#docTitle:hover { background: var(--chrome); }

/* popup menus */
.popup { position: fixed; z-index: 50; min-width: 220px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 4px; }
.popup .mi { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 6px 10px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.popup .mi:hover { background: var(--accentSoft); }
.popup .mi.disabled { color: #9ca3af; pointer-events: none; }
.popup .mi .sc { color: var(--muted); font-size: 11px; }
.popup .mi .chk { width: 14px; display: inline-block; color: var(--accent); }
.popup .sep { height: 1px; background: var(--chrome2); margin: 4px 2px; }
.popup .sub { position: relative; }
.popup .sub > .popup { display: none; position: absolute; left: 100%; top: -5px; }
.popup .sub:hover > .popup { display: block; }

/* toolbar */
#toolbar { display: flex; align-items: center; gap: 2px; padding: 0 8px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tb { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 30px; height: 30px; padding: 0 7px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: #374151; white-space: nowrap; }
.tb:hover { background: var(--chrome); }
.tb.on { background: var(--accentSoft); color: var(--accent); }
.tb svg { width: 18px; height: 18px; }
.tbsep { width: 1px; height: 22px; background: var(--chrome2); margin: 0 6px; flex: none; }
#zoomLabel { min-width: 52px; }

/* main */
#main { display: grid; grid-template-columns: 196px 1fr 268px; min-height: 0; }
#palette { background: #fff; border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; user-select: none; }
.pgroup h4 { margin: 10px 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.ptiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.ptile { height: 52px; border: 1px solid transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: grab; background: #fafafa; }
.ptile:hover { border-color: var(--accent); background: #fff; }
.ptile svg { width: 46px; height: 38px; pointer-events: none; }
.dragGhost { position: fixed; z-index: 60; pointer-events: none; opacity: .75; }

#stage { position: relative; overflow: hidden; background: var(--canvas); }
#rulerTop { position: absolute; left: 20px; top: 0; height: 20px; width: calc(100% - 20px); background: #fafafa; cursor: s-resize; }
#rulerLeft { position: absolute; left: 0; top: 20px; width: 20px; height: calc(100% - 20px); background: #fafafa; cursor: e-resize; }
#rulerCorner { position: absolute; left: 0; top: 0; width: 20px; height: 20px; background: #f0f0f0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; }
#viewport { position: absolute; left: 20px; top: 20px; right: 0; bottom: 0; overflow: hidden; }
#stage.norulers #viewport { left: 0; top: 0; }
#stage.norulers #rulerTop, #stage.norulers #rulerLeft, #stage.norulers #rulerCorner { display: none; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#svg.panning { cursor: grabbing; }
#htmlLayer { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.editorBox { position: absolute; display: flex; flex-direction: column; pointer-events: auto; outline: 2px solid var(--accent); outline-offset: 1px; background: rgba(255,255,255,.6); }
.editorBox .ed { outline: none; min-height: 1.2em; cursor: text; -webkit-user-select: text; user-select: text; }

/* format panel */
#format { background: #fff; border-left: 1px solid var(--line); overflow-y: auto; }
.fsec { border-bottom: 1px solid var(--chrome2); padding: 10px 12px 12px; }
.fsec h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.frow { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
.frow label.l { width: 64px; color: var(--muted); flex: none; }
.frow input[type=number], .frow input[type=text], .frow select { height: 26px; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; background: #fff; min-width: 0; }
.frow input[type=number] { width: 62px; }
.frow select { flex: 1; }
.frow input[type=color] { width: 30px; height: 26px; border: 1px solid var(--line); border-radius: 5px; padding: 1px; background: #fff; }
.btn { height: 28px; padding: 0 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.on { background: var(--accentSoft); border-color: var(--accent); color: var(--accent); }
.btn.sm { height: 26px; padding: 0 8px; min-width: 28px; }
.btngrp { display: inline-flex; }
.btngrp .btn { border-radius: 0; margin-left: -1px; }
.btngrp .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.btngrp .btn:last-child { border-radius: 0 6px 6px 0; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 4px 0; }
.sw { height: 22px; border-radius: 5px; border: 1.5px solid; cursor: pointer; }
.sw:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.align9 { display: grid; grid-template-columns: repeat(3, 22px); gap: 2px; }
.align9 button { width: 22px; height: 22px; border: 1px solid var(--line); background: #fff; border-radius: 3px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
.align9 button.on { background: var(--accent); border-color: var(--accent); }
.align9 button i { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; }
.align9 button.on i { background: #fff; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
.chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* pages */
#pagebar { display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--chrome); border-top: 1px solid var(--line); }
#tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { padding: 4px 12px; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; color: var(--muted); }
.tab.on { background: #fff; color: var(--text); box-shadow: 0 -1px 0 var(--line) inset; }
#addPage { border: 0; background: none; font-size: 18px; width: 26px; height: 24px; border-radius: 6px; cursor: pointer; color: var(--muted); }
#addPage:hover { background: var(--chrome2); }
#statusText { margin-left: auto; color: var(--muted); font-size: 12px; }

/* modals */
.modalBack { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 80; display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); min-width: 340px; max-width: min(92vw, 760px); max-height: 88vh; display: flex; flex-direction: column; }
.modal header { padding: 14px 18px 4px; font-weight: 600; font-size: 15px; }
.modal .body { padding: 8px 18px; overflow: auto; }
.modal footer { padding: 12px 18px 14px; display: flex; justify-content: flex-end; gap: 8px; }
.modal table { border-collapse: collapse; width: 100%; }
.modal td, .modal th { border-bottom: 1px solid var(--chrome2); padding: 6px 8px; text-align: left; vertical-align: middle; }
.modal th { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.modal td input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
kbd { background: var(--chrome); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: inherit; }
#toast { position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 90; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,.08); }

#overlay, #gridLayer { pointer-events: none; }
.modalBack.side { background: transparent; justify-content: flex-end; align-items: flex-start; padding: 90px 290px 0 0; pointer-events: none; }
.modalBack.side .modal { pointer-events: auto; box-shadow: 0 10px 34px rgba(0,0,0,.22); }

</style>
</head>
